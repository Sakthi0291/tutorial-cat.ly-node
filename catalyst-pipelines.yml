version: 1.0
pipeline-when:
    equal:
        - << event.ref >>
        - refs/heads/master
jobs:
  hello:
    steps:
      - echo "<< event.ref >>"
  world:
    steps:
      - echo "World"
  hello-world:
    steps:
      - echo "Hello World!"
stages:
  - name: build
    jobs:
      - - hello
        - world
      - hello-world